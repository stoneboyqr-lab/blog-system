<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Comments — Admin</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

<link href="../css/admin-common.css" rel="stylesheet"/><link href="../css/comments.css" rel="stylesheet"/></head>
<body>
    <div id="adminBackdrop"></div>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<aside class="sidebar">
<div class="sidebar-logo"><a href="../index.html">STONE<span>BOY</span><sub>— Admin Panel</sub></a></div>
<nav class="sidebar-nav">
<div class="nav-group-label">Content</div>
<a class="sidebar-link" href="dashboard.html"><span class="icon">◈</span> Dashboard</a>
<a class="sidebar-link" href="posts.html"><span class="icon">✦</span> All Posts</a>
<a class="sidebar-link" href="create-post.html"><span class="icon">＋</span> New Post</a>
<a class="sidebar-link" href="categories.html"><span class="icon">◉</span> Categories</a>
<div class="nav-group-label">Community</div>
<a class="sidebar-link active" href="comments.html"><span class="icon">◎</span> Comments <span class="badge" id="pendingBadge">0</span></a>
<div class="nav-group-label">Site</div>
<a class="sidebar-link" href="../index.html"><span class="icon">↗</span> View Blog</a>
</nav>
<div class="sidebar-footer">
<div class="admin-info">
<div class="admin-avatar">L</div>
<div><div class="admin-name">Livingstone</div><div class="admin-role">Administrator</div></div>
</div>
<button class="logout-btn" id="logoutBtn">Sign Out →</button>
</div>
</aside>
<main class="main">
<div class="topbar">
<div class="topbar-title">Comments</div>
<div class="filter-tabs">
<button class="filter-tab active" data-filter="all">All</button>
<button class="filter-tab" data-filter="pending">Pending</button>
<button class="filter-tab" data-filter="approved">Approved</button>
</div>
<button id="adminToggle" aria-label="Open menu">
  <span></span>
  <span></span>
</button>
</div>
<div class="content">
<div class="stats-row">
<div class="stat-card total">
<div class="stat-val" id="statTotal">—</div>
<div class="stat-label">Total Comments</div>
</div>
<div class="stat-card pending">
<div class="stat-val" id="statPending">—</div>
<div class="stat-label">Pending Approval</div>
</div>
<div class="stat-card approved">
<div class="stat-val" id="statApproved">—</div>
<div class="stat-label">Approved</div>
</div>
</div>
<div class="comments-list" id="commentsList">
<div class="empty-state"><div class="empty-icon">◎</div><div class="empty-text">Loading comments...</div></div>
</div>
</div>
</main>
<div class="toast" id="toast"></div>

<script src="../js/comments.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
